<ng-container *transloco="let t">
	<p-select-button [options]="interchangeStyleOptions" [ngModel]="getInterchangeStyle()" (onChange)="setInterchangeStyle($event)" [allowEmpty]="false">
		<ng-template #item let-item>
			<div class="column center toggle-item" [pTooltip]="t(item.tooltip)" tooltipPosition="bottom">
				<iconify-icon [icon]="item.icon" aria-hidden="true"></iconify-icon>
				<div class="toggle-label">{{ t(item.tooltip) }}</div>
			</div>
		</ng-template>
	</p-select-button>
</ng-container>
